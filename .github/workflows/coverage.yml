name: Coverage

on:
  pull_request:
    types:
      - synchronize
      - reopened
      - ready_for_review
  push:
    branches:
      - main
  release:
    types: [published]
  workflow_dispatch:

permissions: read-all

jobs:
  coverage:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    concurrency:
      group: coverage-${{ github.event_name != 'pull_request' || github.run_id }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::covr
          needs: coverage

      - name: Generate report and badge
        run: |
          dir.create("cov-out", showWarnings = FALSE)
          library(covr)
          cov <- package_coverage()
          report(cov, file = "cov-out/index.html")
          pct <- round(percent_coverage(cov), 1)
          color <- ifelse(pct >= 90, "brightgreen", ifelse(pct >= 80, "yellow", ifelse(pct >= 70, "orange", "red")))
          url <- sprintf("https://img.shields.io/badge/coverage-%.1f%%25-%s.svg", pct, color)
          download.file(url, destfile = "cov-out/coverage-badge.svg", mode = "wb")
        shell: Rscript {0}

      - name: Deploy to GitHub pages
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4.5.0
        with:
          clean: false
          branch: gh-pages
          folder: cov-out
          target-folder: coverage